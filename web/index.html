<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- scripts/prerender.mjs writes each page's title, description, canonical link and og:title/url/description
         here and drops the generic ones below; 404.html (the shell for unknown paths) keeps the generic ones -->
    <!--app-head-->
    <meta name="description" content="What your broker's trades really cost: which US brokers get you the best price, from the reports they must publish by law (SEC Rules 605 and 606). Checked for new reports every week." />
    <!-- link previews (LinkedIn, Slack, X...); og.png is 1280x640; scripts/prerender.mjs adds its hash to the address -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fills and Fees: is your broker getting you a good price?" />
    <meta property="og:description" content="What your broker's trades really cost: what brokers are paid for your orders vs the prices their customers get, from the reports US brokers must publish by law (SEC Rules 605 and 606). Checked for new reports every week." />
    <meta property="og:url" content="https://fillsandfees.com/" />
    <meta property="og:image" content="https://fillsandfees.com/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Fills and Fees: extra cost per $10,000 traded at US brokers, from the cheapest to the most expensive" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Fills and Fees</title>
    <!-- light and dark follow the system; the browser's own bar takes the page ground (src/index.css --page) -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EDF2F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A2220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F7B6C'/%3E%3Cpath d='M8 21l6-6 4 4 6-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- before first paint: a theme the visitor picked beats the system setting, .js switches on the controls that need a
         script (src/lib/theme.tsx reads and writes the same "theme" key), and .q marks a page opened with a query, whose
         pre-rendered figures are the defaults until the app renders the query's own (App removes it) -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        if (location.search) d.classList.add("q");
        // if the app itself can't load (blocked, or a file renamed by a redeploy), fall back to the no-script page:
        // every table row, no buttons that would do nothing
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t.tagName === "SCRIPT" && t.type === "module") d.classList.remove("js", "q");
        }, true);
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") {
            d.setAttribute("data-theme", t);
            var ground = t === "dark" ? "#1A2220" : "#EDF2F0";
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", ground); });
          }
        } catch (e) {}
      })();
    </script>
    <!-- Cloudflare Web Analytics: page views only, no cookies, no personal data -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "cd88951d4f4840ac9fd2193e5132f816"}'></script>
  </head>
  <body>
    <!-- scripts/prerender.mjs puts each page's HTML in place of the placeholder and removes the loader, so the page is
         readable before any script runs; 404.html and the dev server keep the loader until main.tsx has the data -->
    <div id="root"><!--app-html--><div id="app-loading" class="grid place-items-center py-40 font-sans text-muted"><span class="h-8 w-8 animate-spin rounded-full border-2 border-line border-t-[var(--accent)]"></span><span class="mt-4 text-[13.5px]">Loading the latest reports…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
