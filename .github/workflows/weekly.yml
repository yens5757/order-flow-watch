# Every Monday: fetch any new Rule 605 / 606 reports, rebuild the database and the site, deploy to GitHub Pages.
# Raw downloads are never committed (some firms forbid redistribution); they live in the Actions cache
# between runs, so each week only downloads what is new.
name: Weekly refresh

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write           # the hand-update reminder issue

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Where the site lives. This is the ONE place to change when a custom domain is set up:
      # SITE_BASE becomes "/" and VITE_SITE_URL the new origin (with a trailing slash), and a file
      # web/public/CNAME holding the bare domain must be added so GitHub Pages serves it there.
      # Vite reads SITE_BASE for its base path; the app, the pre-rendered pages, the canonical links
      # and sitemap.xml read VITE_SITE_URL.
      SITE_BASE: /
      VITE_SITE_URL: https://fillsandfees.com/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore raw reports from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # Reports no script can fetch (Citadel's and Interactive Brokers' sites block scripts) come from the
      # PRIVATE repo yens5757/order-flow-watch-private, where they are put by hand. Only runs when the
      # repository secret PRIVATE_DATA_TOKEN is set: a fine-grained personal access token with read-only
      # "Contents" access to that one repo. Layout of the private repo (same as data/raw/605/ here):
      #   605/cdrg/CDRG<YYYYMM>.csv + CDRG<YYYYMM>.zip   Citadel Securities  (summary CSV + detailed report)
      #   605/ibbd/IBBD<YYYYMM>.csv + IBBD<YYYYMM>.zip   Interactive Brokers LLC
      # The detailed report may be the bare pipe-delimited .txt or a zip of it: the parser takes the
      # first .txt member. Everything under 605/ is copied into data/raw/605/ (folder per firm), so it is
      # parsed, cached and kept private exactly like the fetched reports - never committed.
      # The token reaches ONLY the checkout step below, never the job environment: pip, the fetchers (many third-party
      # hosts), npm's lifecycle scripts and the build must not be able to read it. A step `if` cannot read `secrets`,
      # so a one-line step records whether the secret is set (true/false, not its value) and the two steps test that.
      - name: Is the private repo configured? (repository secret PRIVATE_DATA_TOKEN)
        id: private
        run: echo "has=${{ secrets.PRIVATE_DATA_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check out the private repo of hand-downloaded reports
        if: steps.private.outputs.has == 'true'
        uses: actions/checkout@v4
        with:
          repository: yens5757/order-flow-watch-private
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-data
          persist-credentials: false
        continue-on-error: false

      - name: Copy the hand-downloaded reports into the raw folder
        if: steps.private.outputs.has == 'true'
        run: |
          mkdir -p data/raw/605
          cp -r private-data/605/. data/raw/605/
          find data/raw/605/cdrg data/raw/605/ibbd -type f 2>/dev/null | sort

      - name: Fetch new reports
        run: |
          python fetch_finra_606.py
          python fetch_s3_605.py --all-firms --summary-only
          python fetch_s3_605.py
          python fetch_mm_605.py
          python fetch_context.py

      - name: List raw files (cache key changes only when something new arrived)
        run: find data/raw -type f -printf '%P %s\n' | sort > raw-manifest.txt

      - name: Save raw reports for next week
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('raw-manifest.txt') }}
        continue-on-error: true   # same key already saved = nothing new this week

      - name: Build database and analysis
        run: |
          python parse_605_summary.py
          python parse_606.py
          python parse_605_detail.py
          python pfof_vs_execution.py
          python same_stock.py
          python build_site.py

      - name: Remind about updates only a human can do (one open issue, labelled hand-update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python reminders.py > reminder.md
          cat reminder.md
          gh label create hand-update --color d93f0b --description "Data only a human can download" 2>/dev/null || true
          n=$(gh issue list --label hand-update --state open --json number --jq '.[0].number // empty')
          if grep -q "^Nothing due" reminder.md; then
            if [ -n "$n" ]; then gh issue close "$n" --comment "Nothing left to do by hand."; fi
          elif [ -z "$n" ]; then
            gh issue create --title "Updates to do by hand" --label hand-update --body-file reminder.md
          elif [ "$(gh issue view "$n" --json body --jq .body)" != "$(cat reminder.md)" ]; then
            gh issue edit "$n" --body-file reminder.md
            gh issue comment "$n" --body-file reminder.md   # a comment sends the e-mail; an edit does not
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build website (type-check, bundle, then pre-render every page + sitemap.xml + 404.html)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
